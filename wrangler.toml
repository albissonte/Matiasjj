name = "matiasjump"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

[[d1_databases]]
binding     = "DB"              # env.DB en el código
database_name = "matiasjump-db" # nombre que le ponés en el dashboard
database_id   = "0ceb9ad1-9d99-463c-b32a-21bec7190f14"   # ← lo obtenés al crear la DB

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "matias-jump-images"
# Variables de entorno (también se pueden poner en el dashboard)
# ⚠️  NUNCA subas este archivo con valores reales a GitHub público
# Ponelas en el dashboard: Settings → Environment Variables
[vars]
ADMIN_USER     = "matias"
# ADMIN_PASSWORD y SESSION_SECRET van SOLO en el dashboard como secrets
